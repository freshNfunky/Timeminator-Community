      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="gl3" cx="0.8" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
