    <path d="M0 0 V-7" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="62" y="58" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="#ffffff">Timeminator</text>
