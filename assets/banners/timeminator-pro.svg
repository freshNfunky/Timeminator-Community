  <line x1="28" y1="278" x2="272" y2="278" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <g font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#ffffff">
    <g>
